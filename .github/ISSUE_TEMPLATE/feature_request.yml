name: Feature or improvement
description: Propose a change to the platform, the site or the documentation.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or hard today, and for whom.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you suggest. Reference the relevant document in docs/architecture if any.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [frontend, api, auth, community, growth / intelligence, documentation, infra, other]
