[package]
name = "aevum-platform-api"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.5"
actix-http = "3.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
env_logger = "0.11"
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
anyhow = "1.0"
thiserror = "1.0"
dotenv = "0.15"
argon2 = "0.5"
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"
futures-util = "0.3"
aevum-db = { path = "/root/aevum-db/crates/aevum-db" }
tempfile = "3.8"
async-trait = "0.1"
subtle = "2.6"

[profile.release]
lto = true
codegen-units = 1
