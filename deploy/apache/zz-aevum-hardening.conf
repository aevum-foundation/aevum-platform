# ---------------------------------------------------------------
# Aevum — Apache hardening (server-wide)
#
# Install:  /etc/apache2/conf-available/zz-aevum-hardening.conf
# Enable:   a2enmod headers && a2enconf zz-aevum-hardening
# Check:    apachectl configtest && systemctl reload apache2
# Revert:   a2disconf zz-aevum-hardening && systemctl reload apache2
#
# The "zz-" prefix is intentional: conf-enabled/*.conf is loaded in
# alphabetical order, so this file is read after Ubuntu's
# security.conf and its ServerTokens / ServerSignature win.
#
# Does not change DocumentRoot, the release symlink chain
# (/var/www/html -> active -> releases/<sha>) or any ProxyPass.
# See deploy/README.md.
# ---------------------------------------------------------------

# --- Information disclosure -------------------------------------
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# --- Static document root ---------------------------------------
# FollowSymLinks is REQUIRED by aevum-deploy (deployment-plan-v1 §11).
# -Indexes closes directory listings (/js/, /css/, /img/, /components/).
<Directory /var/www/>
    Options -Indexes +FollowSymLinks
</Directory>

# --- Caching -----------------------------------------------------
# HTML, CSS, JS and components are not fingerprinted, so they are
# revalidated on every load (cheap 304 via ETag). This keeps a new
# release visible immediately after `aevum-deploy deploy`.
# Images and fonts change rarely and are cached for 7 days.
<IfModule mod_headers.c>
    <Directory /var/www/>
        <FilesMatch "\.(html|css|js|xml|txt)$">
            Header set Cache-Control "no-cache"
        </FilesMatch>
        <FilesMatch "\.(svg|png|jpe?g|webp|gif|ico|woff2?)$">
            Header set Cache-Control "public, max-age=604800"
        </FilesMatch>
    </Directory>
</IfModule>

# --- Security headers (OWASP Secure Headers, Mozilla Observatory) -
<IfModule mod_headers.c>
    # HTTPS only for one year. includeSubDomains / preload are NOT set:
    # enable them only after www.aevumchain.com serves a valid certificate.
    Header always set Strict-Transport-Security "max-age=31536000" "expr=%{HTTPS} == 'on'"

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()"
    Header always set Cross-Origin-Opener-Policy "same-origin"

    # Content-Security-Policy.
    # Step 1 (default): Report-Only — the browser reports violations in
    #   the console but blocks nothing.
    # Step 2: after PR #5 (scripts moved to /js/entries/) is deployed on
    #   BOTH frontend and backend, comment out the Report-Only line and
    #   uncomment the enforcing line. See deploy/README.md, section CSP.
    # style-src keeps 'unsafe-inline': backend /growth pages and several
    #   static pages use inline style attributes.
    Header always set Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    #Header always set Content-Security-Policy "default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
</IfModule>

# --- favicon.ico -------------------------------------------------
# Browsers and crawlers request /favicon.ico even when <link rel=icon>
# is present. The site ships an SVG logo only.
<IfModule mod_alias.c>
    RedirectMatch 301 ^/favicon\.ico$ /img/aevum-logo.svg
</IfModule>
