<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Aevum — a privacy-first, post-quantum decentralized network built for useful computation and decentralized infrastructure."
    >

    <meta name="theme-color" content="#061426">

    <title>Aevum — The Decentralized Supercomputer</title>

    <link rel="canonical" href="https://aevumchain.com/">

    <!-- ========================================================
         AEVUM DESIGN SYSTEM
         ======================================================== -->

    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/app-shell.css">
    <link rel="stylesheet" href="/css/components.css">

    <!-- ========================================================
         PERFORMANCE
         ======================================================== -->

    <link
        rel="preconnect"
        href="https://cdnjs.cloudflare.com"
        crossorigin
    >

    <!-- ========================================================
         THEME
         ======================================================== -->

    <script src="/js/theme.js"></script>

    <!-- ========================================================
         THREE.JS
         Deferred so HTML parsing is never blocked.
         ======================================================== -->

    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"
        defer
    ></script>


    <!-- ========================================================
         HOME PAGE STYLES

         Global styles belong to:
         theme.css
         app-shell.css
         components.css

         This block contains Home-only composition.
         ======================================================== -->

    <link rel="stylesheet" href="/css/pages/home.css">
</head>


<body>

    <!-- ========================================================
         GLOBAL HEADER
         ======================================================== -->

    <div
        id="header-container"
        aria-label="Site header"
    ></div>


    <!-- ========================================================
         HOME
         ======================================================== -->

    <main
        class="home"
        id="main-content"
    >

        <section
            class="hero"
            aria-labelledby="hero-title"
        >

            <div class="container">

                <div class="hero-content">


                    <!-- ==================================================
                         NETWORK POSITIONING
                         ================================================== -->

                    <div
                        class="hero-badge"
                        aria-label="Post-Quantum, Layer 1 and Layer 2"
                    >
                        Post-Quantum · L1 + L2
                    </div>


                    <!-- ==================================================
                         AEVUM BEE
                         ================================================== -->

                    <div
                        id="bee-container"
                        aria-hidden="true"
                    ></div>


                    <!-- ==================================================
                         PRIMARY MESSAGE
                         ================================================== -->

                    <h1 id="hero-title">
                        The Decentralized<br>
                        <span>Supercomputer</span>
                    </h1>


                    <p class="hero-subtitle">
                        A privacy-first, post-quantum network powered by
                        Proof of Presence, useful computation, epoch consensus
                        and decentralized infrastructure.
                    </p>


                    <!-- ==================================================
                         PRIMARY ACTIONS
                         ================================================== -->

                    <div class="hero-actions">

                        <a
                            href="/explorer.html"
                            class="btn btn-primary"
                        >
                            Explore Network
                        </a>

                        <a
                            href="/docs.html"
                            class="btn btn-secondary"
                        >
                            Documentation
                        </a>

                    </div>


                    <!-- ==================================================
                         NETWORK STATS
                         ================================================== -->

                    <div
                        class="hero-stats"
                        aria-label="Aevum network statistics"
                    >

                        <span class="stat">
                            <strong>371M</strong>
                            Max Supply
                        </span>

                        <span class="stat">
                            <strong>0.01%</strong>
                            L2 Fee
                        </span>

                        <span class="stat">
                            <strong>100k</strong>
                            Epoch Participants
                        </span>

                        <span class="stat">
                            <strong>
                                <span
                                    class="status-mark"
                                    aria-hidden="true"
                                >●</span>
                                Live
                            </strong>
                            Network
                        </span>

                    </div>

                </div>

            </div>

        </section>

    </main>


    <!-- ========================================================
         GLOBAL FOOTER
         ======================================================== -->

    <div
        id="footer-container"
        aria-label="Site footer"
    ></div>


    <!-- ========================================================
         AEVUM COMPONENT LOADER
         ======================================================== -->

    <script type="module">
        import { boot } from '/js/components.js';
        import { initNav } from '/js/navigation.js';
        import { initHomePage } from '/js/pages/home.js';

        await boot();
        await initNav();
        await initHomePage();
    </script>

</body>
</html>
