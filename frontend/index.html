<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Aevum — a privacy-first, post-quantum decentralized network built for useful computation and decentralized infrastructure."
    >

    <meta name="theme-color" content="#061426">

    <title>Aevum — The Decentralized Supercomputer</title>

    <!-- ========================================================
         AEVUM DESIGN SYSTEM
         ======================================================== -->

    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/app-shell.css">
    <link rel="stylesheet" href="/css/components.css">

    <!-- ========================================================
         PERFORMANCE
         ======================================================== -->

    <link
        rel="preconnect"
        href="https://cdnjs.cloudflare.com"
        crossorigin
    >

    <!-- ========================================================
         THEME
         ======================================================== -->

    <script src="/js/theme.js"></script>

    <!-- ========================================================
         THREE.JS
         Deferred so HTML parsing is never blocked.
         ======================================================== -->

    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"
        defer
    ></script>


    <!-- ========================================================
         HOME PAGE STYLES

         Global styles belong to:
         theme.css
         app-shell.css
         components.css

         This block contains Home-only composition.
         ======================================================== -->

    <style>

        /* ====================================================
           HOME
           ==================================================== */

        .home {
            min-height: calc(100vh - var(--header-height, 72px));
        }


        /* ====================================================
           HERO
           ==================================================== */

        .hero {
            min-height: calc(100vh - var(--header-height, 72px));
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px 0 64px;
            text-align: center;
        }

        .hero-content {
            width: 100%;
            max-width: 760px;
            margin: 0 auto;
        }


        /* ====================================================
           BADGE
           ==================================================== */

        .hero-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 32px;
            margin-bottom: 20px;
            padding: 6px 18px;

            color: var(--color-accent-gold);
            background: var(--color-accent-gold-dim);
            border: 1px solid var(--color-border-gold);
            border-radius: var(--radius-pill);

            font-size: 12px;
            font-weight: 600;
            line-height: 1.3;
            letter-spacing: 0.04em;
        }

        .hero-badge::before {
            content: "";
            width: 6px;
            height: 6px;
            flex: 0 0 auto;

            border-radius: 50%;
            background: var(--color-accent-cyan);

            box-shadow:
                0 0 10px rgba(32, 217, 255, 0.45);
        }


        /* ====================================================
           TITLE
           ==================================================== */

        .hero-content h1 {
            margin: 0 0 18px;

            color: var(--color-text-primary);

            font-size: clamp(38px, 6vw, 64px);
            font-weight: 800;
            line-height: 1.05;
            letter-spacing: -0.035em;
        }

        .hero-content h1 span {
            color: var(--color-accent-gold);
        }


        /* ====================================================
           SUBTITLE
           ==================================================== */

        .hero-subtitle {
            max-width: 600px;
            margin: 0 auto 32px;

            color: var(--color-text-secondary);

            font-size: 18px;
            line-height: 1.7;
        }


        /* ====================================================
           3D BEE
           ==================================================== */

        #bee-container {
            position: relative;

            width: 100%;
            max-width: 420px;
            height: 320px;

            margin: 0 auto 18px;

            contain: layout paint;
        }

        #bee-container canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
        }

        .bee-fallback {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 100%;
            height: 100%;

            color: var(--color-text-muted);

            font-size: 13px;
            letter-spacing: 0.08em;
        }


        /* ====================================================
           HERO ACTIONS
           ==================================================== */

        .hero-actions {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;

            gap: 12px;

            margin-bottom: 42px;
        }


        /* ====================================================
           HERO STATS
           ==================================================== */

        .hero-stats {
            display: flex;
            align-items: stretch;
            justify-content: center;
            flex-wrap: wrap;
        }

        .hero-stats .stat {
            min-width: 130px;

            padding: 0 24px;

            color: var(--color-text-muted);

            font-size: 13px;
            line-height: 1.5;
        }

        .hero-stats .stat + .stat {
            border-left: 1px solid var(--color-border);
        }

        .hero-stats .stat strong {
            display: block;

            margin-bottom: 2px;

            color: var(--color-text-primary);

            font-size: 23px;
            font-weight: 700;
            line-height: 1.2;
        }

        .hero-stats .status-mark {
            color: var(--color-accent-cyan);
            font-size: 14px;
        }


        /* ====================================================
           RESPONSIVE
           ==================================================== */

        @media (max-width: 768px) {

            .hero {
                min-height: auto;
                padding: 32px 0 48px;
            }

            .hero-subtitle {
                font-size: 16px;
            }

            #bee-container {
                height: 250px;
            }

            .hero-stats {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));

                width: min(100%, 420px);

                margin: 0 auto;
            }

            .hero-stats .stat {
                min-width: 0;
                padding: 12px;
                border-top: 1px solid var(--color-border);
            }

            .hero-stats .stat + .stat {
                border-left: 0;
            }

            .hero-stats .stat:nth-child(1),
            .hero-stats .stat:nth-child(2) {
                border-top: 0;
            }

            .hero-stats .stat:nth-child(2),
            .hero-stats .stat:nth-child(4) {
                border-left: 1px solid var(--color-border);
            }
        }


        @media (max-width: 480px) {

            .hero {
                padding-top: 24px;
            }

            .hero-content h1 {
                font-size: 34px;
            }

            .hero-subtitle {
                font-size: 15px;
                line-height: 1.65;
            }

            #bee-container {
                height: 205px;
            }

            .hero-actions {
                flex-direction: column;
            }

            .hero-actions .btn {
                width: min(100%, 300px);
            }

            .hero-stats .stat strong {
                font-size: 19px;
            }

            .hero-stats .stat {
                font-size: 12px;
            }
        }


        /* ====================================================
           REDUCED MOTION
           ==================================================== */

        @media (prefers-reduced-motion: reduce) {

            #bee-container {
                visibility: hidden;
            }
        }

    </style>
</head>


<body>

    <!-- ========================================================
         GLOBAL HEADER
         ======================================================== -->

    <div
        id="header-container"
        aria-label="Site header"
    ></div>


    <!-- ========================================================
         HOME
         ======================================================== -->

    <main
        class="home"
        id="main-content"
    >

        <section
            class="hero"
            aria-labelledby="hero-title"
        >

            <div class="container">

                <div class="hero-content">


                    <!-- ==================================================
                         NETWORK POSITIONING
                         ================================================== -->

                    <div
                        class="hero-badge"
                        aria-label="Post-Quantum, Layer 1 and Layer 2"
                    >
                        Post-Quantum · L1 + L2
                    </div>


                    <!-- ==================================================
                         AEVUM BEE
                         ================================================== -->

                    <div
                        id="bee-container"
                        aria-hidden="true"
                    ></div>


                    <!-- ==================================================
                         PRIMARY MESSAGE
                         ================================================== -->

                    <h1 id="hero-title">
                        The Decentralized<br>
                        <span>Supercomputer</span>
                    </h1>


                    <p class="hero-subtitle">
                        A privacy-first, post-quantum network powered by
                        Proof of Presence, useful computation, epoch consensus
                        and decentralized infrastructure.
                    </p>


                    <!-- ==================================================
                         PRIMARY ACTIONS
                         ================================================== -->

                    <div class="hero-actions">

                        <a
                            href="/explorer.html"
                            class="btn btn-primary"
                        >
                            Explore Network
                        </a>

                        <a
                            href="/docs.html"
                            class="btn btn-secondary"
                        >
                            Documentation
                        </a>

                    </div>


                    <!-- ==================================================
                         NETWORK STATS
                         ================================================== -->

                    <div
                        class="hero-stats"
                        aria-label="Aevum network statistics"
                    >

                        <span class="stat">
                            <strong>371M</strong>
                            Max Supply
                        </span>

                        <span class="stat">
                            <strong>0.01%</strong>
                            L2 Fee
                        </span>

                        <span class="stat">
                            <strong>100k</strong>
                            Epoch Participants
                        </span>

                        <span class="stat">
                            <strong>
                                <span
                                    class="status-mark"
                                    aria-hidden="true"
                                >●</span>
                                Live
                            </strong>
                            Network
                        </span>

                    </div>

                </div>

            </div>

        </section>

    </main>


    <!-- ========================================================
         GLOBAL FOOTER
         ======================================================== -->

    <div
        id="footer-container"
        aria-label="Site footer"
    ></div>


    <!-- ========================================================
         AEVUM COMPONENT LOADER
         ======================================================== -->

    <script type="module">
        import { boot } from '/js/components.js';
        import { initNav } from '/js/navigation.js';
        import { initHomePage } from '/js/pages/home.js';

        await boot();
        await initNav();
        await initHomePage();
    </script>

</body>
</html>
